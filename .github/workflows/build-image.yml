name: Build LTX-2.5 image

# Builds the CUDA 13.2 LTX-2.5 image on a GitHub-hosted runner (which has Docker
# and full network access) and pushes it to GHCR, where Vast.ai can pull it.
#
# No local Docker needed. Run it from the repo's Actions tab
# ("Run workflow") — the default GITHUB_TOKEN usually grants package write, so no
# secrets are required for a public repo.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push"
        required: true
        default: "cu132"
      ltx_ref:
        description: "Lightricks/LTX-2 git ref to build"
        required: true
        default: "main"
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "scripts/**"
      - ".github/workflows/build-image.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/josephatwoosh/ltx25

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # The runner's root filesystem is ~72 GB with only ~22 GB free, and this
      # two-stage CUDA build needs much more. Reclaim the preinstalled toolchains
      # we don't use (measured ~28 GB on x64 runners).
      - name: Free disk space
        run: |
          set -eux
          df -h /
          sudo rm -rf /usr/lib/jvm \
                      /usr/local/.ghcup \
                      /usr/local/lib/android \
                      /usr/local/share/powershell \
                      /usr/share/dotnet \
                      /usr/share/swift \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" \
                      /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            LTX_REF=${{ github.event.inputs.ltx_ref || 'main' }}
          # Single platform and NO attestations, so the tag is a plain image
          # manifest instead of an OCI index. An index makes the tag a two-step
          # pull (index -> child manifest by digest), and the run that produced
          # :cu132 left an index whose amd64 child returned MANIFEST_UNKNOWN from
          # GHCR, i.e. `docker pull` failed even though the tag "existed".
          # A direct manifest also makes the printed digest a stable thing for a
          # Vast template to pin.
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ env.IMAGE }}:${{ github.event.inputs.tag || 'cu132' }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          # mode=min: the gha cache competes for the same 72 GB disk as the build.
          cache-from: type=gha
          cache-to: type=gha,mode=min

      # Pull the pushed reference back out of GHCR, which is exactly what a Vast
      # host will do. Run #3 was green while the tag was unpullable (the index's
      # amd64 child returned MANIFEST_UNKNOWN), so a successful push is not
      # evidence of a usable image; only a real pull is.
      - name: Verify the pushed image pulls back
        run: |
          set -eux
          TAG="${{ github.event.inputs.tag || 'cu132' }}"
          docker pull "${IMAGE}:${TAG}"
          DIGESTS=$(docker image inspect "${IMAGE}:${TAG}" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}')
          echo "${DIGESTS}"
          {
            echo "### Verified: the pushed image pulls"
            echo
            echo '```'
            echo "${DIGESTS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Proves the image runs and that its Python stack imports, without a GPU.
      - name: Smoke test
        run: |
          set -eux
          TAG="${{ github.event.inputs.tag || 'cu132' }}"
          docker run --rm "${IMAGE}:${TAG}" \
            python -c "import torch, ltx_pipelines, sys; print('torch', torch.__version__, '| cuda build', torch.version.cuda); print('ok')"
          # Every upstream module must at least construct its CLI. a2vid is the
          # audio-driven path; a missing/renamed module fails here, not on a
          # rented GPU with 122 GiB of weights loaded.
          docker run --rm "${IMAGE}:${TAG}" \
            python -m ltx_pipelines.a2vid_two_stage --help > /dev/null
          docker run --rm "${IMAGE}:${TAG}" ltx2-a2vid --help > /dev/null

      - name: Summary
        run: |
          {
            echo "### Image pushed"
            echo
            echo '```'
            echo "${IMAGE}:${{ github.event.inputs.tag || 'cu132' }}"
            echo '```'
            echo
            echo "Pull it on Vast.ai as the template image. Make the GHCR package"
            echo "public (Package settings -> Change visibility) so Vast can pull it,"
            echo "or supply registry credentials via the template's docker login fields."
          } >> "$GITHUB_STEP_SUMMARY"
